name: Multi-Platform Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-22.04
            target: --linux

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libsecret-1-dev

      - name: Install Dependencies
        run: npm ci

      - name: Rebuild Native Modules
        run: npm run rebuild

      - name: Compile Application (Vite & TypeScript)
        run: npm run compile

      - name: Build & Publish Release to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref_name }}" =~ -(alpha|beta|rc|canary|pre|dev|preview) ]]; then
            echo "Publishing as GitHub Pre-Release..."
            npx electron-builder ${{ matrix.target }} --publish always -c.publish.releaseType=prerelease
          else
            echo "Publishing as Standard Production Release..."
            npx electron-builder ${{ matrix.target }} --publish always -c.publish.releaseType=release
          fi

      - name: Ensure GitHub Pre-Release Flags
        if: contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-preview') || contains(github.ref_name, '-dev')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --prerelease=true --latest=false || true
